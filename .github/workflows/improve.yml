name: Improve

# WikiMem's self-improvement loop for this repository. Weekly (and on demand) it builds, then runs the tests and the
# golden evals. Then it points WikiMem at the repository's own notes and writes a proposals report. The report goes
# to the run summary, an artifact and one open issue labelled "proposal". It needs no secret, never changes the code
# and never merges.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  self-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - name: Evals and proposals
        run: node eval/propose.mjs proposals.md

      - name: Publish the proposals
        if: always()
        run: test -f proposals.md && cat proposals.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proposals
          path: proposals.md
          if-no-files-found: ignore

      - name: Open or update the proposal issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          f=proposals.md
          if [ ! -s "$f" ]; then echo "No proposal to open."; exit 0; fi
          body="$RUNNER_TEMP/proposal-issue.md"
          {
            echo "Written by the scheduled self-improvement loop on $(date -u '+%Y-%m-%d %H:%M UTC'). It proposes; a person decides. The loop never merges."
            echo
            cat "$f"
          } > "$body"
          gh label create proposal --color 2f5d8a --description "A change the self-improvement loop proposes for a person to review" --force
          n=$(gh issue list --label proposal --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file "$body"
          else
            gh issue create --title "WikiMem: proposal from the self-improvement loop" --label proposal --body-file "$body"
          fi
