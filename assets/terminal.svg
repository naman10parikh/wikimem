<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">wikimem --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: wikimem [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">Build self-improving knowledge bases with LLMs. Ingest anything, query</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">everything, auto-evolve.</text>
<text x="24" y="166" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">  -V, --version                output the version number</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">  -h, --help                   display help for command</text>
<text x="24" y="246" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">  init [options] [directory]   Create a new wikimem vault</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">  ingest [options] &lt;source&gt;    Ingest a source file, URL, or directory into the</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">                               wiki</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">  add-source [options] &lt;path&gt;  Incrementally ingest a file or folder, skipping</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">                               unchanged files (mtime + sha256)</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">  query [options] &lt;question&gt;   Ask a question against the wiki</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">  search [options] &lt;query&gt;     Search wiki pages (BM25 keyword search)</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">  ask [options] &lt;question&gt;     Ask a question — LLM-powered Q&amp;A against the wiki</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">  lint [options]               Health-check the wiki for issues</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">  status [options]             Show vault statistics</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">  watch [options]              Watch raw/ directory and auto-ingest new files</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">  scrape [options]             Fetch content from configured external sources</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve">                               (Automation 2)</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">  sandbox-run [options]        Scrape untrusted external content inside an</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve">                               isolated E2B sandbox (requires E2B_API_KEY)</text>
<text x="24" y="586" fill="#d8d3c8" xml:space="preserve">…</text>
</svg>
